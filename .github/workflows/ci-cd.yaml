name: CI/CD Pipeline - TransitX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r airflow/requirements.txt
          pip install dvc[gcs] google-cloud-storage

      - name: Run basic tests
        run: |
          echo "Linting and smoke tests..."
          python -m compileall src/

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      - name: Install gcloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          install_components: "gke-gcloud-auth-plugin"

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker gcr.io --quiet

      - name: Write service account key for DVC
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > sa-key.json

      - name: DVC pull data
        run: |
          dvc remote modify gcp_remote credentialpath sa-key.json
          dvc pull --force

      - name: Build Docker image
        run: |
          IMAGE_NAME=us-central1-docker.pkg.dev/$GCP_PROJECT_ID/transitx/transitx:latest
          docker build -t $IMAGE_NAME -f ./Dockerfile .

      - name: Authenticate Docker with GCP
        run: |
          gcloud auth activate-service-account --key-file=sa-key.json
          gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Push Docker image to Artifact Registry
        run: |
          IMAGE_NAME=us-central1-docker.pkg.dev/$GCP_PROJECT_ID/transitx/transitx:latest
          docker push $IMAGE_NAME

      - name: Deploy to Cloud Run
        run: |
          IMAGE_NAME=us-central1-docker.pkg.dev/$GCP_PROJECT_ID/transitx/transitx:latest
          gcloud run deploy transitx-api \
            --image $IMAGE_NAME \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated
