name: CI/CD Pipeline - TransitX

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r airflow/requirements.txt
          pip install -r requirements.txt
          pip install dvc[gcs] google-cloud-storage

      - name: Run basic tests
        run: |
          python -m compileall src/

      - name: Install Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: DVC Pull Data
        run: |
          echo "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" > sa-key.json
          dvc remote modify gcp_remote credentialpath sa-key.json
          dvc pull --force

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          IMAGE_NAME=gcr.io/$GCP_PROJECT_ID/transitx:latest
          docker build -t $IMAGE_NAME -f ./Dockerfile .

      - name: Push image to GCR
        run: |
          IMAGE_NAME=gcr.io/$GCP_PROJECT_ID/transitx:latest
          docker push $IMAGE_NAME

      - name: Deploy to Cloud Run
        run: |
          IMAGE_NAME=gcr.io/$GCP_PROJECT_ID/transitx:latest
          gcloud run deploy transitx-api \
            --image $IMAGE_NAME \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated
