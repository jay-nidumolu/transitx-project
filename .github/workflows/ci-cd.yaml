name: CI/CD Pipeline - TransitX

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r airflow/requirements.txt
          pip install dvc[gcs] google-cloud-storage

      - name: Run basic tests
        run: |
          echo "Linting and smoke test..."
          python -m compileall src/

      - name: Set up GCP authentication
        run: |
          echo "${GCP_SERVICE_ACCOUNT_KEY}" > sa-key.json
          gcloud auth activate-service-account --key-file=sa-key.json

      - name: DVC Pull Data
        run: |
          dvc remote modify gcp_remote credentialpath sa-key.json
          dvc pull --force

      - name: Build Docker image
        run: |
          IMAGE_NAME=gcr.io/$GCP_PROJECT_ID/transitx:latest
          docker build -t $IMAGE_NAME -f ./Dockerfile .

      - name: Push image to GCR
        run: |
          IMAGE_NAME=gcr.io/$GCP_PROJECT_ID/transitx:latest
          docker push $IMAGE_NAME

      - name: Deploy to Cloud Run
        run: |
          IMAGE_NAME=gcr.io/$GCP_PROJECT_ID/transitx:latest
          gcloud run deploy transitx-api \
            --image $IMAGE_NAME \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated
