name: CI/CD Pipeline - TransitX

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r airflow/requirements.txt
          pip install dvc[gcs]

      - name: Run basic tests
        run: |
          echo "Linting and smoke test..."
          python -m compileall src/
      
      - name: Set up GCP authentication
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" > gcp-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/gcp-key.json


      - name: DVC Pull Data
        run: |
          dvc pull

      - name: Check if API-related files changed
        id: api_changes
        run: |
          echo "::set-output name=changed::$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E 'deployment/Dockerfile|src/|requirements.txt' || true)"

      - name: Build Docker image
        if: steps.api_changes.outputs.changed != ''
        run: |
          docker build -t $DOCKERHUB_USERNAME/transitx:latest -f deployment/Dockerfile .

      - name: Log in to DockerHub
        if: steps.api_changes.outputs.changed != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to DockerHub
        if: steps.api_changes.outputs.changed != ''
        run: |
          docker push $DOCKERHUB_USERNAME/transitx:latest
